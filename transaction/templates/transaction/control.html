<div class="glass-card p-3 mb-4 animate-fadeInUp stagger-2">

        <div class="search-wrapper">
            <div class="position-relative">
                <i class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                <input type="text"
                       class="form-control glass-input ps-5"
                       id="transactionSearchInput"
                       data-live-search
                       data-target="#transactionTable"
                       placeholder="Ketik nomor kontrak, nasabah, atau barang...">
            </div>
        </div>
        <span class="text-muted fs-8">
            <i class="fa-solid fa-info-circle me-1"></i>
            Klik menu <strong>Transaksi Baru</strong> di sidebar untuk membuat transaksi.
        </span>
