<header class="glass-nav sticky-top py-2 px-3 px-lg-4 mb-4">
    <div class="container-fluid d-flex align-items-center justify-content-between p-0">
        <div class="d-flex align-items-center gap-3">
            <button type="button"
                    class="glass-btn d-lg-none px-2 py-1"
                    id="sidebarToggleBtn"
                    aria-label="Toggle Navigation">
                <i class="fa-solid fa-bars-staggered fs-5"></i>
            </button>
            <a href="{% url 'core:index' %}"
               class="d-flex align-items-center gap-2 text-decoration-none">
                {% if orgs and orgs.logo %}
                    <img src="{{ orgs.logo.url }}"
                         alt="{% firstof orgs.name orgs.legal_name orgs.brand_name fallback_app_name %}"
                         class="brand-mark rounded-3 border border-2 border-white shadow-sm object-fit-cover">
                {% else %}
                    <div class="brand-mark rounded-3 d-flex align-items-center justify-content-center text-white">
                        <i class="fa-solid fa-building fs-6"></i>
                    </div>
                {% endif %}
                <span class="fw-bold fs-5 text-dark tracking-tight text-truncate">
                    {% firstof orgs.name orgs.legal_name orgs.brand_name fallback_app_name %}
                </span>
            </a>
        </div>
        <div class="d-flex align-items-center gap-2 gap-sm-3">
            <div class="dropdown">
                <a href="#"
                   class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle text-dark"
                   data-bs-toggle="dropdown">
                    {% if navbar_data.avatar_url %}
                        <img src="{{ navbar_data.avatar_url }}"
                             alt="{{ navbar_data.display_name }}"
                             class="avatar-sm rounded-circle border border-2 border-white shadow-sm">
                    {% else %}
                        <div class="avatar-sm-initial rounded-circle border border-2 border-white shadow-sm d-flex align-items-center justify-content-center text-white fw-semibold">
                            {{ navbar_data.initial }}
                        </div>
                    {% endif %}
                    <div class="d-none d-sm-block text-start lh-1">
                        <div class="fw-semibold fs-7">{{ navbar_data.display_name }}</div>
                        <small class="text-muted fs-8">{{ navbar_data.role_label }}</small>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end glass-card border-0 shadow-lg mt-2 p-2">
                    <li>
                        <a class="dropdown-item rounded-2 py-2"
                           href="{% url 'account:profile-detail' %}">
                            <i class="fa-regular fa-user me-2 text-muted"></i> Profil Saya
                        </a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <a class="dropdown-item rounded-2 py-2 text-danger"
                           href="{% url 'logout' %}">
                            <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
