<div class="{{ wrapper_class|default:'' }}">
    <label for="{{ field.id_for_label }}"
           class="form-label fw-semibold fs-7 mb-1">
        {{ field.label }}
        {% if field.field.required %}
            <span class="text-danger">*</span>
        {% elif field.field.widget.input_type != "checkbox" %}
            <small class="text-muted fw-normal">(opsional)</small>
        {% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <div class="form-text fs-8 text-muted mt-1">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
        <div class="text-danger fs-8 mt-1">{{ field.errors|striptags }}</div>
    {% endif %}
</div>
