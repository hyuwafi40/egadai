<div class="text-center py-4">
    <div class="fallback-icon d-inline-flex align-items-center justify-content-center rounded-circle mb-3">
        <i class="fa-solid {{ icon }}"></i>
    </div>
    <h3 class="h6 fw-bold mb-2">{{ title }}</h3>
    <p class="text-muted fs-7 mb-3">{{ message }}</p>
    {% if action_url and action_label %}
        <a href="{{ action_url }}" class="glass-btn glass-btn-primary">
            {% if action_icon %}<i class="fa-solid {{ action_icon }}"></i>{% endif %}
            <span>{{ action_label }}</span>
        </a>
    {% endif %}
</div>
