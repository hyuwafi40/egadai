{% extends "core/base.html" %}
{% block title %}Brand{% endblock %}
{% block heading %}
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center justify-content-center rounded-3 text-white brand-mark">
                <i class="fa-solid fa-tags fs-6"></i>
            </div>
            <div>
                <h1 class="h4 fw-bold mb-0 tracking-tight">Brand</h1>
                <p class="text-muted mb-0 fs-7">Informasi identitas aplikasi</p>
            </div>
        </div>
        <a href="{% url 'core:brand-update' %}"
           class="glass-btn glass-btn-primary">
            <i class="fa-solid fa-pen-to-square"></i>
            <span>Edit Brand</span>
        </a>
    </div>
{% endblock %}
{% block content %}
    {% include "core/brand/detail.html" %}
{% endblock %}
