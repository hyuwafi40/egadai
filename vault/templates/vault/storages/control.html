<div class="glass-card p-3 mb-4 animate-fadeInUp stagger-2">
    <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-between">
        <div class="search-wrapper">
            <div class="position-relative">
                <i class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                <input type="text"
                       class="form-control glass-input ps-5"
                       id="storagesSearchInput"
                       data-live-search
                       data-target="#storagesTable"
                       placeholder="Cari nama, kode gudang, kota...">
            </div>
        </div>
        <a href="{% url 'vault:storages-create' %}"
           class="glass-btn glass-btn-primary">
            <i class="fa-solid fa-plus"></i>
            <span>Tambah Gudang</span>
        </a>
    </div>
</div>
