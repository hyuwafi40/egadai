<div class="glass-card p-3 mb-4 animate-fadeInUp stagger-2">
    <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-between">
        <div class="search-wrapper">
            <div class="position-relative">
                <i class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                <input type="text"
                       class="form-control glass-input ps-5"
                       id="userSearchInput"
                       data-live-search
                       data-target="#userTable"
                       placeholder="Ketik username atau email...">
            </div>
        </div>
        <button type="button" class="glass-btn glass-btn-primary" data-user-create>
            <i class="fa-solid fa-plus"></i>
            <span>Tambah User</span>
        </button>
    </div>
</div>
