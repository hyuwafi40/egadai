{% load static %}
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 - Halaman Tidak Ditemukan</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="{% static 'css/error.css' %}">
    </head>
    <body>
        <div class="ambient-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
        <div class="error-card">
            <div class="error-icon error-icon-info">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">Halaman Tidak Ditemukan</h1>
            <p class="error-message">
                Halaman yang Anda cari tidak tersedia atau telah dipindahkan.
                Periksa kembali tautan yang Anda gunakan atau kembali ke halaman utama.
            </p>
            <div class="error-actions">
                <button type="button"
                        class="error-btn error-btn-secondary"
                        onclick="history.back()">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Kembali</span>
                </button>
                <a href="{% url 'core:index' %}" class="error-btn error-btn-primary">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </div>
        </div>
    </body>
</html>
