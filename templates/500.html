{% load static %}
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>500 - Kesalahan Server Internal</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="{% static 'css/error.css' %}">
    </head>
    <body>
        <div class="ambient-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
        <div class="error-card">
            <div class="error-icon error-icon-danger">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="error-code">500</div>
            <h1 class="error-title">Kesalahan Server Internal</h1>
            <p class="error-message">
                Terjadi kesalahan pada server. Tim kami sedang menangani masalah ini.
                Silakan muat ulang halaman atau coba beberapa saat lagi.
            </p>
            <div class="error-actions">
                <button type="button"
                        class="error-btn error-btn-secondary"
                        onclick="location.reload()">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Muat Ulang</span>
                </button>
                <a href="/" class="error-btn error-btn-primary">
                    <i class="fa-solid fa-house"></i>
                    <span>Beranda</span>
                </a>
            </div>
        </div>
    </body>
</html>
